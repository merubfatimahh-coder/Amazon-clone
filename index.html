<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon.com.Spend less.Smile more.</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <hearder>
           <div class="navbar">
               <div class="nav-logo">
                <img src="amazon.logo1.jpg" id="img1">
               </div>
               <div class="nav-location border">
                <p>Deliver to</p>
                <div class=".location-line2">
                <i class="fa-solid fa-location-dot" style="color: #ffffff;"></i>
                <span>Pakistan</span></div>
               </div>
               <div class="nav-search">
                <select class="option border">
                    <option>All</option>
                </select>
                <input type="text" placeholder="Search Amazon" class="input border">
                <i class="fa-solid fa-magnifying-glass" id="magnify"></i>
               </div>
               <div class="nav-flag border">
                <img src="amazon_flag.jpg" id="img2">
                <p id="flag-p">EN</p>
               </div>
               <div class="nav-sign border">
                <p id="sign-p">Hello, sign in</p>
                <span>Account & Lists</span>
               </div>
               <div class="nav-return border">
                <p id="return-p">Return</p>
                <span>& Orders.</span>
               </div>
               <div class="nav-cart border">
                <i class="fa-solid fa-cart-shopping" id="art-logo"></i>
                <p id="cart-p">Cart</p>
               </div>
           </div>
           <div class="panel">
              <div class="all border">
              <i class="fa-solid fa-bars"></i>
              <span>All</span>
              </div>
              <div class="panel-menu">
                <p class="border"> Today's Deals</p>
                <p class="border"> Prime Video</p>
                <p class="border">Register</p>
                <p class="border">Gift Cards</p>
                <p class="border">Customer Service</p>
                <p class="border">Sell</p>
              </div>
           </div>
    </hearder>

    <div class="section">
        <img src="amazon_front.jpg" class="section">
        <div class="boxes1-4">
        <div class="box1"> 
            <h2>Get your game on</h2>
            <img src="get_your_game_on_box1.jpg" id="box1img">
            <span>shop gaming</span>
        </div>
        </div>
    </div>
         
</body>
</html>
